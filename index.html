<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nordic Homes — QC-3 Module Checklist</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:14px;color:#333;background:#f5f5f5;min-height:100vh}
.top-bar{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.top-bar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top-bar-title{font-size:15px;font-weight:700}
.top-bar-sub{font-size:11px;opacity:0.6}
.top-bar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.module-select{padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:13px;cursor:pointer;font-family:Arial}
.module-select option{background:#1a1a2e;color:#fff}
.drive-btn{font-size:12px;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.3);cursor:pointer;background:transparent;color:#fff;font-family:Arial}
.drive-btn.connected{background:#1D9E75;border-color:#1D9E75}
.btn-save{padding:7px 16px;border:1px solid #378ADD;border-radius:8px;background:#378ADD;color:#fff;font-size:13px;cursor:pointer;font-family:Arial}
.btn-save:hover{background:#2570c0}
.btn-export{padding:7px 16px;border:1px solid #1D9E75;border-radius:8px;background:#1D9E75;color:#fff;font-size:13px;cursor:pointer;font-family:Arial;font-weight:700}
.btn-export:hover{background:#178a64}
.save-status{font-size:11px;color:#aaa}
.container{max-width:960px;margin:0 auto;padding:16px}
.drive-info{background:#e8f4ff;border:1px solid #b3d4f5;border-radius:8px;padding:10px 14px;font-size:12px;color:#1a5a8a;margin-bottom:14px}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.overview-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all 0.15s}
.overview-card:hover{border-color:#1a1a2e}
.overview-card.active-mod{border-color:#1a1a2e;border-width:2px}
.overview-card .mod-name{font-size:14px;font-weight:700;margin-bottom:6px}
.overview-card .mod-ok{color:#1D9E75;font-size:12px}
.overview-card .mod-rej{color:#E24B4A;font-size:12px}
.overview-card .mod-pend{color:#EF9F27;font-size:12px}
.overview-card .mod-bar{background:#eee;border-radius:3px;height:4px;margin-top:6px;overflow:hidden}
.overview-card .mod-bar-fill{height:100%;background:#1D9E75;border-radius:3px}
.card{background:#fff;border-radius:10px;border:1px solid #e0e0e0;padding:16px 20px;margin-bottom:14px}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.meta-row input{flex:1;min-width:150px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:Arial}
.meta-row input:focus{outline:none;border-color:#1a1a2e}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px}
.stat{background:#f8f8f8;border-radius:8px;padding:10px;text-align:center;border:1px solid #eee}
.stat .val{font-size:22px;font-weight:700}
.stat .lbl{font-size:11px;color:#888;margin-top:2px}
.stat.ok .val{color:#1D9E75}
.stat.rej .val{color:#E24B4A}
.stat.pend .val{color:#EF9F27}
.progress-bar{background:#eee;border-radius:4px;height:7px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;background:#1D9E75;border-radius:4px;transition:width 0.4s}
.prog-text{font-size:12px;color:#888;margin-bottom:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:5px 14px;border:1px solid #ddd;border-radius:20px;background:#fff;color:#666;font-size:12px;cursor:pointer}
.filter-btn.active{background:#1a1a2e;border-color:#1a1a2e;color:#fff}
.item{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:13px 15px;margin-bottom:8px}
.item.accepted{border-left:12px solid #1D9E75}
.item.rejected{border-left:12px solid #E24B4A}
.item.na{border-left:12px solid #aaa;opacity:0.7}
.item-top{display:flex;align-items:flex-start;gap:10px}
.item-num{font-size:11px;font-weight:700;color:#aaa;min-width:24px;padding-top:2px}
.item-sec-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#f0f0f0;color:#666;white-space:nowrap;flex-shrink:0;margin-top:1px}
.item-desc{flex:1;font-size:13px;line-height:1.5}
.item-actions{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn-accept{padding:5px 13px;border:1px solid #ccc;border-radius:7px;font-size:12px;cursor:pointer;background:#fff;color:#555;font-family:Arial}
.btn-accept:hover{background:#f0faf5}
.btn-accept.active{background:#e6f7f0;border-color:#1D9E75;color:#1D9E75;font-weight:700}
.btn-reject{padding:5px 13px;border:1px solid #ccc;border-radius:7px;font-size:12px;cursor:pointer;background:#fff;color:#555;font-family:Arial}
.btn-reject:hover{background:#fff5f5}
.btn-reject.active{background:#fef0f0;border-color:#E24B4A;color:#E24B4A;font-weight:700}
.btn-photo{padding:5px 11px;border:1px dashed #aaa;border-radius:7px;font-size:12px;cursor:pointer;background:transparent;color:#666;font-family:Arial}
.btn-photo:hover{background:#f5f5f5}
.notes-inp{flex:1;min-width:130px;padding:5px 10px;border:1px solid #ddd;border-radius:7px;font-size:12px;font-family:Arial}
.notes-inp:focus{outline:none;border-color:#1a1a2e}
.btn-del{padding:4px 9px;border:1px solid #fcc;border-radius:7px;font-size:11px;cursor:pointer;background:#fff8f8;color:#E24B4A;font-family:Arial}
.btn-na{padding:5px 13px;border:1px solid #ccc;border-radius:7px;font-size:12px;cursor:pointer;background:#fff;color:#888;font-family:Arial}
.btn-na:hover{background:#f5f5f5}
.btn-na.active{background:#f0f0f0;border-color:#888;color:#555;font-weight:700}
.photos-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumb{position:relative;width:68px;height:68px;border-radius:7px;overflow:hidden;border:1px solid #ddd;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.thumb .del-p{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.65);border:none;color:#fff;border-radius:3px;padding:1px 5px;font-size:10px;cursor:pointer;line-height:1.5}
.add-form{background:#f9f9f9;border:1px solid #e0e0e0;border-radius:10px;padding:15px;margin-top:10px}
.add-form h3{font-size:13px;font-weight:700;margin-bottom:10px;color:#444}
.add-form .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.add-form input,.add-form textarea{padding:7px 10px;border:1px solid #ddd;border-radius:7px;background:#fff;font-size:13px;font-family:Arial}
.btn-add{padding:8px 18px;border:1px solid #1a1a2e;border-radius:7px;background:#1a1a2e;color:#fff;font-size:13px;cursor:pointer;font-family:Arial}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:92%;max-height:92%;border-radius:8px}
.lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer;background:none;border:none;line-height:1}
.cam-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:9990;flex-direction:column;align-items:center;justify-content:space-between;height:100dvh}
.cam-modal.open{display:flex}
.cam-video{width:100%;flex:1;min-height:0;object-fit:cover;background:#111}
.cam-bottom{width:100%;padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#111;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.cam-shoot{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff;cursor:pointer;flex-shrink:0;font-size:28px;display:flex;align-items:center;justify-content:center}
.cam-count{color:#fff;font-size:13px;text-align:center;min-width:60px}
.cam-done{padding:12px 20px;border:2px solid #1D9E75;border-radius:10px;background:#1D9E75;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:Arial}
.cam-close{padding:12px 20px;border:2px solid #aaa;border-radius:10px;background:transparent;color:#fff;font-size:14px;cursor:pointer;font-family:Arial}
.cam-top{width:100%;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:#111;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cam-title{color:#fff;font-size:14px;font-weight:700}
.cam-previews{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:#222;width:100%;height:80px;min-height:80px;align-items:center;flex-shrink:0}
.cam-thumb{width:60px;height:60px;border-radius:6px;object-fit:cover;flex-shrink:0;border:2px solid #555}
#photo-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998;align-items:flex-end;justify-content:center}
@media(max-width:600px){.item-actions{gap:4px}.meta-row input{min-width:100%}}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <div>
      <div class="top-bar-title" id="project-title">Nordic Homes — QC-3</div>
      <div class="top-bar-sub">Module Checklist</div>
    </div>
    <select class="module-select" id="project-select" onchange="switchProject(this.value)" style="background:rgba(255,255,255,0.15);font-weight:700">
      <option value="ISL_Holaborg">ISL Holaborg</option>
      <option value="ISL_Jorfi">ISL Jorfi</option>
      <option value="ISL_Mariuborg">ISL Mariuborg</option>
    </select>
    <select class="module-select" id="module-select" onchange="switchModule(this.value)">
      <option value="">— Select module —</option>
    </select>
  </div>
  <div class="top-bar-right">
    <span class="save-status" id="save-status"></span>
    <button class="drive-btn" id="drive-btn" onclick="handleMsAuth()">&#9679; Connect OneDrive</button>
    <button class="btn-save" onclick="recoverPhotos()" title="Scan OneDrive and restore missing photo links">&#128247; Recover Photos</button>
    <button class="btn-save" onclick="saveToDrive()">&#8679; Save</button>
    <button class="btn-export" onclick="exportProtocol()">&#8681; Export Protocol</button>
  </div>
</div>

<div class="container">
  <div class="drive-info" id="drive-info" style="display:none">
    &#10003; Connected to OneDrive. Data saved to <strong id="drive-folder-name">Nordic_QC3</strong>. &nbsp;<span id="drive-folder-link"></span>
  </div>

  <div class="overview-grid" id="overview-grid"></div>

  <div id="module-content" style="display:none">
    <div class="card">
      <div class="meta-row">
        <input type="text" id="inspector-input" placeholder="Quality controller name"/>
        <input type="text" id="pm-input" placeholder="Project manager name"/>
        <input type="date" id="date-input"/>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-text" id="prog-text">0 of 51 checked (0%)</div>
      <div class="stats">
        <div class="stat ok"><div class="val" id="s-ok">0</div><div class="lbl">Accepted</div></div>
        <div class="stat rej"><div class="val" id="s-rej">0</div><div class="lbl">Rejected</div></div>
        <div class="stat pend"><div class="val" id="s-pend">51</div><div class="lbl">Pending</div></div>
        <div class="stat"><div class="val" id="s-na">0</div><div class="lbl">N/A</div></div>
        <div class="stat"><div class="val" id="s-photos">0</div><div class="lbl">Photos</div></div>
      </div>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
      <button class="filter-btn" onclick="setFilter('accepted',this)">Accepted</button>
      <button class="filter-btn" onclick="setFilter('rejected',this)">Rejected</button>
      <button class="filter-btn" onclick="setFilter('photos',this)">With photos</button>
      <button class="filter-btn" onclick="setFilter('na',this)">N/A</button>
    </div>
    <div id="checklist"></div>
    <div class="add-form" id="add-item-form">
      <h3>+ Add new inspection item</h3>
      <div class="row">
        <input type="text" id="new-section" placeholder="Section" style="flex:1;min-width:140px"/>
        <textarea id="new-desc" placeholder="Work description..." rows="2" style="flex:2;min-width:200px;resize:vertical"></textarea>
      </div>
      <button class="btn-add" onclick="addItem()">+ Add item</button>
    </div>
  </div>
</div>

<div id="photo-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998;align-items:flex-end;justify-content:center">
  <div style="background:#fff;border-radius:16px 16px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;text-align:center">
    <p id="photo-modal-title" style="font-size:15px;font-weight:700;margin-bottom:20px;color:#333">Add photo</p>
    <button onclick="photoModalChoose('camera')" style="width:100%;padding:16px;border:1.5px solid #1D9E75;border-radius:12px;background:#1D9E75;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:Arial;margin-bottom:10px">📷 Take photo (camera)</button>
    <button onclick="photoModalChoose('gallery')" style="width:100%;padding:14px;border:1.5px solid #1a1a2e;border-radius:12px;background:#1a1a2e;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:Arial;margin-bottom:10px">🖼 Choose from gallery</button>
    <button id="photo-modal-done" onclick="stopShooting()" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#f5f5f5;color:#666;font-size:14px;cursor:pointer;font-family:Arial">Cancel</button>
  </div>
</div>

<div class="cam-modal" id="cam-modal">
  <div class="cam-top">
    <span class="cam-title">📷 Camera — Item #<span id="cam-item-label"></span></span>
    <button class="cam-close" onclick="closeCamera()">✕ Cancel</button>
  </div>
  <video class="cam-video" id="cam-video" autoplay playsinline muted></video>
  <canvas id="cam-canvas" style="display:none"></canvas>
  <div class="cam-previews" id="cam-previews"><span style="color:#777;font-size:12px">No photos yet</span></div>
  <div class="cam-bottom">
    <div class="cam-count" id="cam-count">0 photos</div>
    <button class="cam-shoot" id="cam-shoot-btn" onclick="shootPhoto()">📷</button>
    <button class="cam-done" onclick="doneShooting()">Done ✓</button>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('open')">&times;</button>
  <img id="lightbox-img" src="" alt="Photo"/>
</div>

<input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handlePhotos(event)"/>
<input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhotos(event)"/>

// ---- MICROSOFT AUTH (PKCE) ----
async function generateCodeVerifier(){
  const arr=new Uint8Array(32);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function generateCodeChallenge(verifier){
  const data=new TextEncoder().encode(verifier);
  const digest=await crypto.subtle.digest('SHA-256',data);
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function handleMsAuth(){
  if(msConnected){setStatus('Already connected');return;}
  const verifier=await generateCodeVerifier();
  const challenge=await generateCodeChallenge(verifier);
  sessionStorage.setItem('pkce_verifier',verifier);
  const params=new URLSearchParams({
    client_id:MS_CLIENT_ID,
    response_type:'code',
    redirect_uri:MS_REDIRECT_URI,
    scope:MS_SCOPES.join(' ')+' offline_access',
    code_challenge:challenge,
    code_challenge_method:'S256',
    response_mode:'query'
  });
  window.location.href=`https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/authorize?${params}`;
}

async function exchangeCodeForToken(code){
  const verifier=sessionStorage.getItem('pkce_verifier');
  if(!verifier){throw new Error('No PKCE verifier');}
  const body=new URLSearchParams({
    client_id:MS_CLIENT_ID,
    grant_type:'authorization_code',
    code,
    redirect_uri:MS_REDIRECT_URI,
    code_verifier:verifier,
    scope:MS_SCOPES.join(' ')+' offline_access'
  });
  const res=await fetch(`https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token`,{method:'POST',body,headers:{'Content-Type':'application/x-www-form-urlencoded'}});
  const data=await res.json();
  if(data.error)throw new Error(data.error_description||data.error);
  return data;
}

async function refreshAccessToken(){
  const rt=localStorage.getItem('ms_refresh_token');
  if(!rt)throw new Error('No refresh token');
  const body=new URLSearchParams({
    client_id:MS_CLIENT_ID,
    grant_type:'refresh_token',
    refresh_token:rt,
    scope:MS_SCOPES.join(' ')+' offline_access'
  });
  const res=await fetch(`https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token`,{method:'POST',body,headers:{'Content-Type':'application/x-www-form-urlencoded'}});
  const data=await res.json();
  if(data.error)throw new Error(data.error_description||data.error);
  return data;
}

function saveTokens(data){
  msToken=data.access_token;
  msTokenExpiry=Date.now()+(data.expires_in-300)*1000;
  if(data.refresh_token)localStorage.setItem('ms_refresh_token',data.refresh_token);
  localStorage.setItem('ms_token_expiry',String(msTokenExpiry));
}

let tokenRefreshPromise=null;
async function ensureToken(){
  if(msToken&&Date.now()<msTokenExpiry)return msToken;
  if(!tokenRefreshPromise){
    tokenRefreshPromise=refreshAccessToken()
      .then(data=>{saveTokens(data);return msToken;})
      .finally(()=>{tokenRefreshPromise=null;});
  }
  return tokenRefreshPromise;
}

async function graphRequest(path,options={}){
  const token=await ensureToken();
  const res=await fetch(GRAPH_BASE+path,{
    ...options,
    headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(options.headers||{})}
  });
  if(!res.ok){
    const err=await res.text();
    throw new Error(`Graph ${res.status}: ${err}`);
  }
  if(res.status===204)return null;
  const ct=res.headers.get('content-type')||'';
  if(ct.includes('application/json'))return res.json();
  return res;
}

// ---- INIT: handle redirect with auth code ----
async function initAuth(){
  const url=new URL(window.location.href);
  const code=url.searchParams.get('code');
  if(code){
    url.searchParams.delete('code');
    url.searchParams.delete('state');
    window.history.replaceState({},'',url.toString());
    setStatus('Connecting to OneDrive...');
    try{
      const data=await exchangeCodeForToken(code);
      saveTokens(data);
      sessionStorage.removeItem('pkce_verifier');
      await onConnected();
    }catch(e){setStatus('Auth error: '+e.message);}
    return;
  }
  // Try silent restore
  const expiry=parseInt(localStorage.getItem('ms_token_expiry')||'0');
  const rt=localStorage.getItem('ms_refresh_token');
  if(rt){
    try{
      setStatus('Restoring OneDrive connection...');
      const data=await refreshAccessToken();
      saveTokens(data);
      await onConnected();
    }catch(e){
      setStatus('Please reconnect OneDrive');
      localStorage.removeItem('ms_refresh_token');
    }
  }
}

// ---- ONEDRIVE FOLDER MANAGEMENT ----
async function ensureFolder(parentId,name){
  // Search for existing
  const search=await graphRequest(`/me/drive/items/${parentId}/children?$filter=name eq '${encodeURIComponent(name)}'&$select=id,name,webUrl`);
  const existing=(search.value||[]).find(f=>f.name===name);
  if(existing)return existing;
  // Create
  const created=await graphRequest(`/me/drive/items/${parentId}/children`,{
    method:'POST',
    body:JSON.stringify({name,folder:{},['@microsoft.graph.conflictBehavior']:'rename'})
  });
  return created;
}

// Root + project folder are created once per project and memoized,
// so they no longer block module loading.
let rootFoldersPromise=null;
function ensureRootFolders(){
  if(!rootFoldersPromise){
    const cfg=getProjectCfg();
    rootFoldersPromise=(async()=>{
      const root=await ensureFolder('root','Nordic_QC3');
      rootFolderId=root.id;
      const projFolder=await ensureFolder(rootFolderId,cfg.folder);
      if(cfg===getProjectCfg()){
        document.getElementById('drive-folder-name').textContent=cfg.folder;
        document.getElementById('drive-folder-link').innerHTML=`<a href="${projFolder.webUrl}" target="_blank">Open in OneDrive</a>`;
      }
      return projFolder;
    })().catch(e=>{rootFoldersPromise=null;throw e;});
  }
  return rootFoldersPromise;
}

async function ensureProjectFolderAndLoad(){
  moduleFolderIds={};
  driveFileIds={};
  rootFoldersPromise=null;
  ensureRootFolders().catch(e=>{setStatus('OneDrive error: '+e.message);console.error(e);});
  await loadAllFromDrive();
}

async function ensureModuleFolder(modName){
  if(moduleFolderIds[modName])return moduleFolderIds[modName];
  const projFolder=await ensureRootFolders();
  const modFolder=await ensureFolder(projFolder.id,modName);
  moduleFolderIds[modName]=modFolder.id;
  return modFolder.id;
}

// ---- LOCAL CACHE ----
// Own key: the ISL/GER app runs on the same github.io origin and uses 'qc_modules_cache_v1'
const LOCAL_CACHE_KEY='qc3_onedrive_cache_v1';
let driveETags={};          // modName -> eTag of the JSON version currently shown
let dirtyModules=new Set(); // modules with local changes not yet saved to OneDrive
let editSeq={};             // modName -> edit counter (so a save doesn't clear newer edits)
let lastSyncAt=0;
let syncGen=0;

function moduleFileName(modName){return `qc_${modName.replace(/[ -]/g,'')}.json`;}

function modulePayload(modName){
  const m=modules[modName];
  return {
    meta:m.meta,
    items:m.items.map(i=>({
      id:i.id,section:i.section,desc:i.desc,status:i.status,
      notes:i.notes,acceptedDate:i.acceptedDate,rejectedDate:i.rejectedDate,
      filledBy:i.filledBy||'',photoIds:(i.photoIds||[]).filter(Boolean)
    }))
  };
}

// Applies saved JSON (from OneDrive or cache) onto a fresh template
function applySavedToModule(modName,saved){
  const mod=modules[modName];
  if(!mod||!saved)return;
  const items=freshItems();
  (saved.items||[]).forEach(si=>{
    const ids=(si.photoIds||[]).filter(Boolean);
    const previews=ids.map(did=>({previewId:did,driveId:did,uploading:false,dataUrl:''}));
    const cur=items.find(i=>i.id===si.id);
    if(cur){
      // Only trust saved data if the description still matches the template item
      if(!si.desc||si.desc===cur.desc){
        cur.status=si.status||'pending';
        cur.notes=si.notes||'';
        cur.acceptedDate=si.acceptedDate||'';
        cur.rejectedDate=si.rejectedDate||'';
        cur.filledBy=si.filledBy||'';
        cur.photoIds=ids;
        cur.photoPreviews=previews;
      }
    }else{
      // Custom item added via "Add item" — keep it
      items.push({...si,status:si.status||'pending',notes:si.notes||'',acceptedDate:si.acceptedDate||'',
        rejectedDate:si.rejectedDate||'',filledBy:si.filledBy||'',photoIds:ids,photoPreviews:previews});
    }
  });
  items.sort((a,b)=>a.id-b.id);
  mod.items=items;
  if(saved.meta)mod.meta=saved.meta;
}

function saveToLocalCache(){
  try{
    const cache={v:1,project:currentProject,module:currentModule,modules:{},etags:driveETags,dirty:[...dirtyModules]};
    Object.keys(modules).forEach(k=>{cache.modules[k]=modulePayload(k);});
    localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify(cache));
  }catch(e){console.warn('Local cache save error:',e);}
}

function restoreFromLocalCache(){
  try{
    const raw=localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw)return null;
    const cache=JSON.parse(raw);
    if(!cache||cache.v!==1)return null;
    Object.entries(cache.modules||{}).forEach(([k,v])=>{if(modules[k])applySavedToModule(k,v);});
    driveETags=cache.etags||{};
    dirtyModules=new Set(cache.dirty||[]);
    return cache;
  }catch(e){console.warn('Local cache restore error:',e);return null;}
}

function hasUploadingPhotos(modName){
  return (modules[modName]?.items||[]).some(i=>(i.photoPreviews||[]).some(p=>p.uploading));
}

// ---- LOAD/SAVE ----
// All modules are checked in parallel; a module's JSON is only downloaded
// when its eTag differs from the cached version.
async function loadAllFromDrive(){
  const gen=++syncGen;
  const mods=getProjectCfg().modules.slice();
  setStatus('Syncing with OneDrive...');
  const changed=[];let failed=0;
  await Promise.all(mods.map(m=>loadModuleFromDrive(m)
    .then(c=>{if(c)changed.push(m);})
    .catch(e=>{failed++;console.warn('Load error for '+m,e);})));
  lastSyncAt=Date.now();
  saveToLocalCache();
  if(gen!==syncGen)return; // project switched meanwhile
  if(currentModule&&changed.includes(currentModule))render();
  else loadThumbnails();
  renderOverview();
  setStatus(failed?`Synced — ${failed} module(s) failed to load`:'All modules loaded ✓');
  // Push local changes that never reached OneDrive (e.g. app closed before save)
  if(mods.some(m=>dirtyModules.has(m)))flushDirty();
}

async function loadModuleFromDrive(modName){
  const projCfg=getProjectCfg();
  let meta;
  try{
    meta=await graphRequest(`/me/drive/root:/Nordic_QC3/${projCfg.folder}/${modName}/${moduleFileName(modName)}?$select=id,eTag,parentReference`);
  }catch(e){
    if(/Graph 404/.test(e.message))return false; // no JSON (or folder) yet
    throw e;
  }
  if(!meta||!meta.id)return false;
  driveFileIds[modName]=meta.id;
  if(meta.parentReference&&meta.parentReference.id)moduleFolderIds[modName]=meta.parentReference.id;
  if(dirtyModules.has(modName))return false;               // local unsaved changes win
  if(meta.eTag&&driveETags[modName]===meta.eTag)return false; // unchanged since cached
  let saved=await graphRequest(`/me/drive/items/${meta.id}/content`);
  if(saved&&typeof saved.text==='function')saved=JSON.parse(await saved.text()); // non-JSON content-type from download redirect
  else if(typeof saved==='string')saved=JSON.parse(saved);
  // User may have started editing while we were downloading
  if(dirtyModules.has(modName)||hasUploadingPhotos(modName))return false;
  applySavedToModule(modName,saved);
  driveETags[modName]=meta.eTag||'';
  return true;
}

async function saveModuleToDrive(modName){
  const seq=editSeq[modName]||0;
  const body=JSON.stringify(modulePayload(modName));
  const opts={method:'PUT',headers:{'Content-Type':'application/json'},body};
  let res;
  if(driveFileIds[modName]){
    res=await graphRequest(`/me/drive/items/${driveFileIds[modName]}/content`,opts);
  }else{
    const modFolderId=await ensureModuleFolder(modName);
    res=await graphRequest(`/me/drive/items/${modFolderId}:/${moduleFileName(modName)}:/content`,opts);
  }
  if(res&&res.id)driveFileIds[modName]=res.id;
  if(res&&res.eTag)driveETags[modName]=res.eTag;
  if((editSeq[modName]||0)===seq)dirtyModules.delete(modName);
  saveToLocalCache();
}

let flushing=false,flushAgain=false;
async function flushDirty(){
  if(!msConnected)return;
  if(flushing){flushAgain=true;return;}
  flushing=true;
  try{
    do{
      flushAgain=false;
      const list=[...dirtyModules].filter(m=>modules[m]);
      if(!list.length)break;
      setStatus('Saving...');
      for(const m of list){
        if(hasUploadingPhotos(m))continue; // saved again after upload finishes
        await saveModuleToDrive(m);
      }
      setStatus('Saved ✓ '+new Date().toLocaleTimeString());
      renderOverview();
    }while(flushAgain);
  }catch(e){setStatus('Save error: '+e.message);}
  finally{flushing=false;}
}

function markDirty(modName){
  if(!modName)return;
  dirtyModules.add(modName);
  editSeq[modName]=(editSeq[modName]||0)+1;
}

async function saveToDrive(){
  if(!msConnected){alert('Please connect OneDrive first.');return;}
  if(!currentModule){alert('Please select a module first.');return;}
  modules[currentModule].meta.inspector=document.getElementById('inspector-input').value;
  modules[currentModule].meta.pm=document.getElementById('pm-input').value;
  modules[currentModule].meta.date=document.getElementById('date-input').value;
  markDirty(currentModule);
  saveToLocalCache();
  clearTimeout(autoSaveTimer);
  await flushDirty();
}

// ---- PHOTO UPLOAD ----
async function uploadPhotoToDrive(dataUrl,filename,modName){
  modName=modName||currentModule;
  if(!msConnected||!modName)throw new Error('OneDrive not connected');
  {
    const base64=dataUrl.split(',')[1];
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const modFolderId=await ensureModuleFolder(modName);
    const res=await fetch(`${GRAPH_BASE}/me/drive/items/${modFolderId}:/${filename}:/content`,{
      method:'PUT',
      headers:{Authorization:`Bearer ${await ensureToken()}`,'Content-Type':'image/jpeg'},
      body:bytes.buffer
    });
    if(!res.ok)throw new Error('Upload failed: '+res.status);
    const data=await res.json();
    return data.id;
  }
}

// Uploads one photo and records it on the item. The item is looked up again after
// the upload, so a background sync that rebuilt the module can't lose the photo.
async function uploadPhotoForItem(modName,itemId,previewId,dataUrl){
  let driveId=null,lastErr=null;
  for(let attempt=0;attempt<3&&!driveId;attempt++){
    try{
      driveId=await uploadPhotoToDrive(dataUrl,`${modName.replace(/ /g,'_')}_item${itemId}_${Date.now()}.jpg`,modName);
    }catch(e){lastErr=e;console.warn('Photo upload attempt failed:',e);if(attempt<2)await new Promise(r=>setTimeout(r,1500));}
  }
  const it=modules[modName]&&modules[modName].items.find(i=>i.id===itemId);
  if(it){
    it.photoPreviews=it.photoPreviews||[];it.photoIds=it.photoIds||[];
    const ix=it.photoPreviews.findIndex(p=>p.previewId===previewId);
    if(driveId){
      if(ix>=0){
        const pv=it.photoPreviews[ix];pv.uploading=false;pv.driveId=driveId;pv.dataUrl='';
        it.photoIds[ix]=driveId;
      }else if(!it.photoIds.includes(driveId)){
        it.photoIds.push(driveId);
        it.photoPreviews.push({previewId:driveId,driveId,uploading:false,dataUrl:''});
      }
    }else if(ix>=0){
      it.photoPreviews.splice(ix,1);it.photoIds.splice(ix,1); // keep both lists aligned
    }
  }
  if(!driveId)setStatus('⚠ Photo not uploaded: '+(lastErr?lastErr.message:'unknown error'));
  return driveId;
}

async function recoverPhotos(){
  if(!currentModule){alert('Please select a module first.');return;}
  if(!msConnected){alert('Connect OneDrive first.');return;}
  setStatus('Scanning OneDrive folder for photos...');
  try{
    const modFolderId=await ensureModuleFolder(currentModule);
    const res=await graphRequest(`/me/drive/items/${modFolderId}/children?$select=id,name&$top=1000`);
    const allFiles=res.value||[];
    const imageFiles=allFiles.filter(f=>/\.(jpg|jpeg|png)$/i.test(f.name));
    if(imageFiles.length===0){setStatus('No photos found.');return;}
    const mod=modules[currentModule];
    let recovered=0;
    imageFiles.forEach(file=>{
      const m=file.name.match(/_item(\d+)_/);
      if(!m)return;
      const itemId=parseInt(m[1]);
      const item=mod.items.find(i=>i.id===itemId);
      if(!item)return;
      item.photoIds=item.photoIds||[];
      item.photoPreviews=item.photoPreviews||[];
      if(!item.photoIds.includes(file.id)){
        item.photoIds.push(file.id);
        item.photoPreviews.push({previewId:file.id,driveId:file.id,uploading:false,dataUrl:''});
        recovered++;
      }
    });
    render();renderOverview();
    if(recovered>0){
      setStatus(`Recovered ${recovered} photo link(s) ✓ — saving...`);
      await saveToDrive();
    } else {
      setStatus('All photos already linked.');
    }
  }catch(e){setStatus('Recover error: '+e.message);}
}

function qc2Link(mod){return `${QC2_APP}?project=${encodeURIComponent(currentProject)}&module=${encodeURIComponent(mod)}`;}
function qc2BadgeHtml(mod){

async function loadQC2Status(mod,force){

  if(!msConnected||(!force&&qc2Cache[key]&&qc2Cache[key]!=='err'))return;

// Thumbnails: in-memory (per session) + Cache Storage (survives reloads).
// OneDrive item ids are immutable per photo, so cached thumbs never go stale.
const THUMB_CACHE='qc3-thumbs-v1';
const thumbMem=new Map(); // driveId -> Promise<blobUrl|null>
let thumbCachePromise=null;
function openThumbCache(){
  if(!thumbCachePromise)thumbCachePromise=('caches' in window)?caches.open(THUMB_CACHE).catch(()=>null):Promise.resolve(null);
  return thumbCachePromise;
}
function getThumbUrl(id){
  if(thumbMem.has(id))return thumbMem.get(id);
  const p=(async()=>{
    const key=`https://qc3-thumbs.local/${id}`;
    const cache=await openThumbCache();
    let blob=null;
    if(cache){const hit=await cache.match(key);if(hit)blob=await hit.blob();}
    if(!blob){
      if(!msConnected)return null;
      const token=await ensureToken();
      const r=await fetch(`${GRAPH_BASE}/me/drive/items/${id}/thumbnails/0/medium/content`,{headers:{Authorization:`Bearer ${token}`}});
      if(!r.ok)throw new Error('thumb '+r.status);
      blob=await r.blob();
      if(cache)cache.put(key,new Response(blob,{headers:{'Content-Type':blob.type||'image/jpeg'}})).catch(()=>{});
    }
    return URL.createObjectURL(blob);
  })();
  thumbMem.set(id,p);
  p.then(u=>{if(!u)thumbMem.delete(id);}).catch(()=>thumbMem.delete(id));
  return p;
}

function loadThumbnails(){
  document.querySelectorAll('img[data-id]').forEach(img=>{
    const id=img.getAttribute('data-id');
    if(!id||img.src.startsWith('blob:'))return;
    getThumbUrl(id).then(url=>{if(url)img.src=url;}).catch(e=>{
      console.warn('Thumbnail error for',id,e.message);
      img.style.background='#f0f0f0';
    });
  });
}

async function openOneDrivePhoto(driveId){
  const lbImg=document.getElementById('lightbox-img');
  // Show the cached thumbnail instantly, then swap in the full photo
  const thumbEl=document.querySelector(`img[data-id="${driveId}"]`);
  lbImg.src=thumbEl&&thumbEl.src.startsWith('blob:')?thumbEl.src:'';
  document.getElementById('lightbox').classList.add('open');
  try{
    const token=await ensureToken();
    const res=await fetch(`${GRAPH_BASE}/me/drive/items/${driveId}/content`,{headers:{Authorization:`Bearer ${token}`}});
    if(!res.ok)throw new Error('photo '+res.status);
    const blob=await res.blob();
    lbImg.src=URL.createObjectURL(blob);
  }catch(e){console.error('Open photo error:',e);}
}

function extractDateFromFilename(name){
  const m=(name||'').match(/(\d{4})(\d{2})(\d{2})/);
  if(m){const y=parseInt(m[1]),mo=parseInt(m[2]),d=parseInt(m[3]);
    if(y>=2000&&y<=2099&&mo>=1&&mo<=12&&d>=1&&d<=31)return new Date(y,mo-1,d);}
  return null;
}
function getExifDate(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const view=new DataView(e.target.result);
      if(view.getUint16(0,false)!==0xFFD8){resolve(null);return;}
      let offset=2;
      while(offset<view.byteLength){
        if(view.getUint16(offset,false)===0xFFE1){
          const exifLength=view.getUint16(offset+2,false);
          const exifData=new DataView(e.target.result,offset+4,exifLength-2);
          if(String.fromCharCode(exifData.getUint8(0),exifData.getUint8(1),exifData.getUint8(2),exifData.getUint8(3))!=='Exif'){resolve(null);return;}
          const littleEndian=exifData.getUint16(6)===0x4949;
          const ifdOffset=exifData.getUint32(10,littleEndian)+6;
          const entries=exifData.getUint16(ifdOffset,littleEndian);
          for(let i=0;i<entries;i++){
            const tag=exifData.getUint16(ifdOffset+2+i*12,littleEndian);
            if(tag===0x9003||tag===0x0132){
              const valOffset=exifData.getUint32(ifdOffset+2+i*12+8,littleEndian)+6;
              let str='';
              for(let j=0;j<19;j++)str+=String.fromCharCode(exifData.getUint8(valOffset+j));
              const p=str.split(' ')[0].split(':');
              if(p.length===3)resolve(`${p[2]}/${p[1]}/${p[0]}`);
              else resolve(null);
              return;
            }
          }
          resolve(null);return;
        }
        offset+=2+view.getUint16(offset+2,false);
      }
      resolve(null);
    };
    reader.onerror=()=>resolve(null);
    reader.readAsArrayBuffer(file.slice(0,65536));
  });
}

async function handlePhotos(e){
  const files=[...e.target.files];
  const photoMod=currentModule,itemId=currentPhotoItemId;
  const getItem=()=>modules[photoMod]&&modules[photoMod].items.find(i=>i.id===itemId);
  if(!photoMod||!getItem()){e.target.value='';return;}
  if(!msConnected){setStatus('Connect OneDrive first.');e.target.value='';return;}
  // Detect date from first photo
  if(!getItem().acceptedDate&&files.length>0){
    let detected=null;
    for(const f of files){const fnDate=extractDateFromFilename(f.name);if(fnDate){detected=fnDate.toLocaleDateString('en-GB');break;}}
    if(!detected){for(const f of files){const exifStr=await getExifDate(f);if(exifStr){detected=exifStr;break;}}}
    if(!detected&&files[0].lastModified)detected=new Date(files[0].lastModified).toLocaleDateString('en-GB');
    if(detected)getItem().acceptedDate=detected;
  }
  const newPreviews=[];
  for(const f of files){
    let dataUrl;try{dataUrl=await readFile(f);}catch(err){continue;}
    const previewId='p_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const it=getItem();if(!it)break;
    it.photoPreviews=it.photoPreviews||[];it.photoIds=it.photoIds||[];
    it.photoIds.push(null);
    it.photoPreviews.push({previewId,dataUrl,uploading:true,driveId:null});
    newPreviews.push({previewId,dataUrl});
  }
  e.target.value='';
  render();
  // Continuous shooting: bring the "Add photo" window back right away
  if(newPreviews.length&&currentPhotoItemId===itemId){photoSessionCount+=newPreviews.length;showPhotoModal();}
  setStatus(`${newPreviews.length} photo(s) added — uploading...`);
  let ok=0;
  for(const {previewId,dataUrl} of newPreviews){
    if(await uploadPhotoForItem(photoMod,itemId,previewId,dataUrl))ok++;
    if(currentModule===photoMod)render();
  }
  if(ok===newPreviews.length)setStatus('Upload complete ✓');
  autoSave(photoMod);
}
function readFile(f){return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});}

// ---- CAMERA ----
let camStream=null,camPhotos=[],camItemId=null,camUploadQueue=[];

function shootPhoto(){
  const video=document.getElementById('cam-video');
  const canvas=document.getElementById('cam-canvas');
  const maxW=1600;const srcW=video.videoWidth||1280,srcH=video.videoHeight||720;
  const scale=srcW>maxW?maxW/srcW:1;
  canvas.width=Math.round(srcW*scale);canvas.height=Math.round(srcH*scale);
  const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const dataUrl=canvas.toDataURL('image/jpeg',0.8);
  camPhotos.push(dataUrl);
  const prev=document.getElementById('cam-previews');
  if(camPhotos.length===1)prev.innerHTML='';
  const img=document.createElement('img');img.src=dataUrl;img.className='cam-thumb';prev.appendChild(img);
  document.getElementById('cam-count').textContent=camPhotos.length+' photo'+(camPhotos.length>1?'s':'');
  const btn=document.getElementById('cam-shoot-btn');btn.style.background='#1D9E75';setTimeout(()=>btn.style.background='#fff',150);
  uploadCamPhotoNow(dataUrl,camPhotos.length-1);
}

function getCamItem(){
  const mod=getModState();if(!mod)return null;
  const item=mod.items.find(i=>i.id===camItemId);
  if(item)item.__mod=currentModule;return item;
}

async function uploadCamPhotoNow(dataUrl,idx){
  const item=getCamItem();if(!item)return;
  const photoMod=item.__mod||currentModule,itemId=item.id;
  item.photoPreviews=item.photoPreviews||[];item.photoIds=item.photoIds||[];
  const previewId='p_'+Date.now()+'_'+idx;
  item.photoIds.push(null);
  item.photoPreviews.push({previewId,dataUrl,uploading:true,driveId:null});
  camUploadQueue.push(previewId);
  const today=new Date().toLocaleDateString('en-GB');
  if(!item.acceptedDate)item.acceptedDate=today;
  if(currentModule===photoMod)render();
  if(msConnected)await uploadPhotoForItem(photoMod,itemId,previewId,dataUrl);
  camUploadQueue=camUploadQueue.filter(p=>p!==previewId);
  if(currentModule===photoMod)render();
  autoSave(photoMod);
}

async function openInAppCamera(itemId){
  camItemId=itemId;camPhotos=[];camUploadQueue=[];
  document.getElementById('cam-previews').innerHTML='<span style="color:#777;font-size:12px">No photos yet</span>';
  document.getElementById('cam-count').textContent='0 photos';
  document.getElementById('cam-item-label').textContent=itemId;
  document.getElementById('cam-modal').classList.add('open');
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
    document.getElementById('cam-video').srcObject=camStream;
  }catch(err){alert('Camera not available: '+err.message);closeCamera();}
}

async function doneShooting(){
  const count=camPhotos.length;closeCamera();if(count===0)return;
  setStatus('Finishing upload...');
  let waited=0;
  while(camUploadQueue.length>0&&waited<30000){await new Promise(r=>setTimeout(r,300));waited+=300;}
  setStatus(`Done: ${count} photo(s) uploaded ✓`);camPhotos=[];
}

function closeCamera(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  document.getElementById('cam-modal').classList.remove('open');
  document.getElementById('cam-video').srcObject=null;
}

// ---- HELPERS ----
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function dateToISO(d){
  if(!d)return '';const p=d.split('/');
  if(p.length===3)return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
  return '';
}
function setStatus(msg){document.getElementById('save-status').textContent=msg;}
function closeLightbox(e){if(e.target===document.getElementById('lightbox'))document.getElementById('lightbox').classList.remove('open');}

let autoSaveTimer=null;
function autoSave(modName){
  if(currentModule){
    modules[currentModule].meta.inspector=document.getElementById('inspector-input').value;
    modules[currentModule].meta.pm=document.getElementById('pm-input').value;
    modules[currentModule].meta.date=document.getElementById('date-input').value;
  }
  markDirty(typeof modName==='string'?modName:currentModule);
  saveToLocalCache();
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{if(msConnected)flushDirty();},3000);
}

// ---- EXPORT PROTOCOL ----
function exportProtocol(){
  if(!currentModule){alert('Please select a module first.');return;}
  const mod=getModState();
  const inspector=document.getElementById('inspector-input').value||'—';
  const pm=document.getElementById('pm-input').value||'—';
  const dateVal=document.getElementById('date-input').value;
  const date=dateVal?new Date(dateVal).toLocaleDateString('en-GB'):new Date().toLocaleDateString('en-GB');
  const ok=mod.items.filter(i=>i.status==='accepted').length;
  const rej=mod.items.filter(i=>i.status==='rejected').length;
  const pend=mod.items.filter(i=>i.status==='pending').length;
  const na=mod.items.filter(i=>i.status==='na').length;
  const overall=rej===0&&(pend-na)<=0?'ACCEPTED':rej>0?'NOT ACCEPTED':'IN PROGRESS';
  const oColor=overall==='ACCEPTED'?'#1D9E75':overall==='NOT ACCEPTED'?'#E24B4A':'#EF9F27';
  let rows='';
  mod.items.forEach(i=>{
    const sLbl=i.status==='accepted'?'Quality accepted':i.status==='rejected'?'Rejected':i.status==='na'?'N/A':'—';
    const sColor=i.status==='accepted'?'#1D9E75':i.status==='rejected'?'#E24B4A':i.status==='na'?'#888':'#ccc';
    const rejCell=i.status==='rejected'?(i.rejectedDate||''):'';
    const accCell=i.status==='accepted'?(i.acceptedDate||''):'';
    const rowBg=i.status==='na'?'background:#f9f9f9;':i.status==='accepted'?'background:#f0fff8;':'';
    rows+=`<tr style="${rowBg}">
      <td style="padding:2px 6px;border:0.5px solid #ccc;text-align:center;font-size:10px;line-height:1.25">${i.id}</td>
      <td style="padding:2px 6px;border:0.5px solid #ccc;font-size:10px;line-height:1.25;color:#555">${i.section}</td>
      <td style="padding:2px 6px;border:0.5px solid #ccc;font-size:10px;line-height:1.25">${i.desc}</td>
      <td style="padding:2px 6px;border:0.5px solid #ccc;font-size:10px;line-height:1.25;text-align:center;color:#E24B4A">${rejCell||'—'}</td>
      <td style="padding:2px 6px;border:0.5px solid #ccc;font-size:10px;line-height:1.25;text-align:center;color:#1D9E75;font-weight:${accCell?'700':'400'}">${accCell||'—'}</td>
      <td style="padding:2px 6px;border:0.5px solid #ccc;font-size:10px;line-height:1.25;color:${sColor};text-align:center;font-weight:700">${sLbl}</td>
      <td style="padding:2px 6px;border:0.5px solid #ccc;font-size:10px;line-height:1.25">${i.notes||''}</td>
    </tr>`;
  });
  const projLabel=getProjectCfg().label;
  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>QC-3 — ${currentModule}</title>
<style>body{font-family:Arial,sans-serif;max-width:980px;margin:0 auto;padding:28px;color:#333}table{border-collapse:collapse;width:100%}th{background:#f0f0f0;font-size:10px;font-weight:700;padding:4px 6px;line-height:1.25;border:0.5px solid #ccc}td,th{vertical-align:top}tr{page-break-inside:avoid}@media print{body{padding:10px}@page{margin:15mm 12mm}}</style>
</head><body>
<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;padding-bottom:12px;border-bottom:2px solid #333">
<div><div style="font-size:11px;color:#888;margin-bottom:4px">Project: ${projLabel} &nbsp;|&nbsp; Address: Iceland</div>
<h1 style="font-size:18px;font-weight:700;margin-bottom:6px">MODULE CHECKLIST &nbsp; No. QC-3 &nbsp;|&nbsp; Module: ${currentModule}</h1>
<p style="font-size:12px">Date: <strong>${date}</strong></p></div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
<div style="font-size:20px;font-weight:700;color:${oColor};border:2px solid ${oColor};padding:6px 18px;border-radius:4px">${overall}</div>
</div></div>
<table style="margin-bottom:24px"><thead><tr>
<th style="width:24px">No.</th><th style="width:120px">Section</th><th>Works to be tested</th>
<th style="width:72px">Quality rejected, date</th><th style="width:72px">Quality accepted, date</th>
<th style="width:80px">Status</th><th style="width:90px">Notes</th>
</tr></thead><tbody>${rows}</tbody></table>
<div style="background:#f9f9f9;border:1px solid #ddd;border-radius:4px;padding:13px 17px;margin-bottom:26px">
<p style="font-weight:700;font-size:13px;margin-bottom:8px">Meets quality requirements!</p>
<p style="font-size:12px;margin-bottom:2px">Quality controller: <strong>${inspector}</strong></p>
<p style="font-size:11px;color:#777">name, surname, signature / stamp</p></div>
<div style="border:1px solid #ccc;border-radius:4px;padding:13px 17px;margin-bottom:26px">
<p style="font-weight:700;font-size:13px;margin-bottom:10px">MODULE ACCEPTANCE: name, surname, signature / stamp</p>
<p style="font-size:12px;margin-bottom:4px">1. Project manager: <strong>${pm}</strong></p>
<p style="font-size:12px;margin-bottom:14px">2. Quality controller: <strong>${inspector}</strong></p>
<div style="display:flex;gap:14px;align-items:center">
<span style="font-weight:700;font-size:12px">CHECK BY THE PROJECT MANAGER:</span>
<span style="border:1px solid #333;padding:4px 14px;font-size:12px;font-weight:700;color:${overall==='ACCEPTED'?'#1D9E75':'#333'}">${overall==='ACCEPTED'?'☑':'☐'} ACCEPTED</span>
<span style="border:1px solid #333;padding:4px 14px;font-size:12px;font-weight:700;color:${overall==='NOT ACCEPTED'?'#E24B4A':'#333'}">${overall==='NOT ACCEPTED'?'☑':'☐'} NOT ACCEPTED</span>
</div>
<div style="margin-top:18px;border-top:1px solid #999;padding-top:6px;width:200px;font-size:11px;color:#777">Signature:</div></div>
</body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`QC3_${currentModule.replace(/ /g,'_')}_${date.replace(/\//g,'-')}.html`;
  a.click();URL.revokeObjectURL(url);
}

// ---- INIT ----
function initDropdown(){
  const sel=document.getElementById('module-select');
  getProjectCfg().modules.forEach(n=>{
    const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);
  });
  Object.entries(PROJECTS).forEach(([pk,proj])=>{
    proj.modules.forEach(n=>{
      if(!modules[n])modules[n]={meta:{inspector:'Mārtiņš Danilevičs',pm:'Eva Litauniece',date:''},items:freshItems()};
    });
  });
}

initDropdown();
(function restoreSession(){
  const cache=restoreFromLocalCache();
  if(!cache)return;
  if(cache.project&&PROJECTS[cache.project]&&cache.project!==currentProject)switchProject(cache.project);
  if(cache.module&&getProjectCfg().modules.includes(cache.module))switchModule(cache.module);
  setStatus('Loaded from cache');
})();
renderOverview();
initAuth();

// Background re-sync when returning to the app (cheap: unchanged modules are skipped by eTag)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!msConnected)return;
  if(dirtyModules.size)flushDirty();
  if(currentPhotoItemId!==null||camUploadQueue.length)return; // don't rebuild modules mid-shoot
  if(Date.now()-lastSyncAt>2*60*1000)loadAllFromDrive();
});
</script>
